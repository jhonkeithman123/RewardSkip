name: Build RewardSkip

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;35.0.0"

      - name: Source doctor (package / entry-point consistency)
        run: python3 scripts/doctor.py

      - name: Build signed APK (runs doctor --fix as preflight)
        run: python3 scripts/build.py --out RewardSkip.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RewardSkip
          path: RewardSkip.apk
